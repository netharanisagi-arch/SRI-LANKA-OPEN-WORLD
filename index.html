<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SRI LANKA OPEN WORLD — මාතර 🇱🇰</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,'Segoe UI',sans-serif}
#cv{position:fixed;inset:0}
.hud{position:fixed;color:#7fffd4;font-weight:800;text-shadow:0 0 8px #000,0 2px 2px #000;z-index:5;font-size:19px;letter-spacing:1px}
#clock{top:12px;right:16px;color:#5fd0ff}
#money{top:38px;right:16px}
#hp{top:64px;right:16px;color:#ff7bd5}
#stars{top:88px;right:16px;color:#5fd0ff;font-size:15px}
#loc{top:12px;left:12px;background:rgba(20,26,38,.85);color:#fff;padding:8px 14px;border-radius:10px;font-size:15px;font-weight:600}
#mm{position:fixed;left:14px;bottom:14px;width:120px;height:120px;border-radius:50%;border:3px solid #ff7bd5;background:#0b1220;z-index:5;box-shadow:0 0 12px #000}
#stick{position:fixed;left:26px;bottom:150px;width:130px;height:130px;border-radius:50%;background:rgba(0,0,0,.35);border:2px solid rgba(127,255,212,.5);z-index:6;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(127,255,212,.75)}
.btn{position:fixed;z-index:6;width:74px;height:74px;border-radius:50%;background:rgba(10,16,26,.8);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:30px}
#run{right:20px;bottom:120px}#drive{right:104px;bottom:40px}#home{right:20px;bottom:210px;font-size:26px}
.on{background:rgba(127,255,212,.35);border-color:#7fffd4}
#msg{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:14px 20px;border-radius:12px;z-index:9;font-size:16px;text-align:center;max-width:80%}
</style>
</head>
<body>
<div id="cv"></div>
<div class="hud" id="clock">21:35</div>
<div class="hud" id="money">Rs 500,000,000</div>
<div class="hud" id="hp">♥ 100</div>
<div class="hud" id="stars">☆☆☆☆☆</div>
<div id="loc">📍 මාතර නගරය</div>
<canvas id="mm" width="120" height="120"></canvas>
<div id="stick"><div id="knob"></div></div>
<div class="btn" id="run">🏃</div>
<div class="btn" id="drive">🚗</div>
<div class="btn" id="home">🏠</div>
<div id="msg">⏳ මාතර නගරය load වෙන්න...</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const msgEl=document.getElementById('msg');
const msg=t=>{msgEl.style.display=t?'block':'none';if(t)msgEl.textContent=t;};
window.onerror=(m,u,l)=>{msg('❌ ERROR: '+m);return false;};

/* 🌍 මාතර center */
const C={lat:5.9481,lon:80.5549}, R=6378137, M=Math.PI/180;
const toXZ=(lat,lon)=>[(lon-C.lon)*M*R*Math.cos(C.lat*M), -(lat-C.lat)*M*R];

/* 🎬 Scene */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x2a2f4a);
scene.fog=new THREE.Fog(0x2a2f4a,90,430);
const cam=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,1200);
const rend=new THREE.WebGLRenderer({antialias:true});
rend.setPixelRatio(Math.min(devicePixelRatio,2));
rend.setSize(innerWidth,innerHeight);
document.getElementById('cv').appendChild(rend.domElement);
scene.add(new THREE.HemisphereLight(0x8899ff,0x332211,.95));
const sun=new THREE.DirectionalLight(0xffb066,1.1); sun.position.set(-140,70,60); scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),new THREE.MeshStandardMaterial({color:0x33402c,roughness:1}));
ground.rotation.x=-Math.PI/2; scene.add(ground);

/* 🧱 Window texture (GTA dusk look) */
function winTex(col){
  const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  x.fillStyle=col;x.fillRect(0,0,64,64);
  for(let j=8;j<64;j+=16)for(let i=6;i<64;i+=16){
    x.fillStyle=Math.random()<.4?'#ffd27a':'rgba(10,15,30,.85)';x.fillRect(i,j,9,11);
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t;
}
const wallMats=['#cbb89a','#a9b4c4','#8d98a8','#d8cbaa','#b3a28c','#93a2b4'].map(c=>new THREE.MeshStandardMaterial({map:winTex(c),roughness:.85}));
const roadMat=new THREE.MeshStandardMaterial({color:0x2b2b30,roughness:1});
const lineMat=new THREE.MeshBasicMaterial({color:0xffd23f});

/* 🛣️ Polyline → flat ribbon */
function ribbon(pts,w,mat,y){
  const pos=[],idx=[],h=w/2;
  for(let i=0;i<pts.length;i++){
    const p=pts[i],a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];
    const dx=b[0]-a[0],dz=b[1]-a[1],L=Math.hypot(dx,dz)||1;
    const nx=-dz/L*h,nz=dx/L*h;
    pos.push(p[0]+nx,y,p[1]+nz,p[0]-nx,y,p[1]-nz);
    if(i>0){const k=(i-1)*2;idx.push(k,k+2,k+3,k,k+3,k+1);}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);g.computeVertexNormals();
  return new THREE.Mesh(g,mat);
}

/* 📡 සැබෑ මාතර දත්ත (OpenStreetMap) */
const q=`[out:json][timeout:30];(way["highway"](around:800,${C.lat},${C.lon});way["building"](around:800,${C.lat},${C.lon}););out geom;`;
let data;
try{
  const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q)});
  if(!r.ok)throw new Error('HTTP '+r.status);
  data=await r.json();
}catch(e){msg('❌ Data fetch fail: '+e.message+' — නැවත load කරන්න');throw e;}

const roadLines=[],roadPolys=[];
const W={motorway:12,trunk:12,primary:10,secondary:8,tertiary:7,residential:6,unclassified:6,service:4,living_street:5,pedestrian:4,footway:2.5,path:1.6};
for(const el of data.elements){
  if(!el.geometry||el.tags?.building)continue;
  const pts=el.geometry.map(n=>toXZ(n.lat,n.lon));
  if(pts.length<2)continue;
  const w=W[el.tags?.highway]||5;
  scene.add(ribbon(pts,w,roadMat,.02));
  if(w>=7)scene.add(ribbon(pts,.45,lineMat,.03));
  roadLines.push(pts);
  if(pts.length>=12&&roadPolys.length<8)roadPolys.push(pts);
}
let bN=0;
for(const el of data.elements){
  const t=el.tags;if(!t?.building||!el.geometry)continue;
  const pts=el.geometry.map(n=>toXZ(n.lat,n.lon));
  let a=1e9,b=-1e9,c=1e9,d=-1e9;
  for(const p of pts){a=Math.min(a,p[0]);b=Math.max(b,p[0]);c=Math.min(c,p[1]);d=Math.max(d,p[1]);}
  const sx=Math.max(3,b-a),sz=Math.max(3,d-c);
  if(sx*sz>2200)continue;
  let h=parseFloat(t.height)||(parseFloat(t['building:levels'])||0)*3.2||(5+Math.random()*10);
  h=Math.min(Math.max(h,3.5),42);
  const g=new THREE.BoxGeometry(sx,h,sz),uv=g.attributes.uv;
  for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*Math.max(1,sx/6),uv.getY(i)*Math.max(1,h/6));
  const m=new THREE.Mesh(g,wallMats[bN++%wallMats.length]);
  m.position.set((a+b)/2,h/2,(c+d)/2);scene.add(m);
}

/* 🚗 රථ */
function makeCar(col){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.9,.7,4.2),new THREE.MeshStandardMaterial({color:col,metalness:.3,roughness:.5}));body.position.y=.75;g.add(body);
  const cab=new THREE.Mesh(new THREE.BoxGeometry(1.7,.6,2.2),new THREE.MeshStandardMaterial({color:0x1a2233,roughness:.3}));cab.position.set(0,1.3,-.2);g.add(cab);
  const hl=new THREE.Mesh(new THREE.BoxGeometry(1.6,.25,.1),new THREE.MeshBasicMaterial({color:0xfff2b0}));hl.position.set(0,.8,2.12);g.add(hl);
  const tl=new THREE.Mesh(new THREE.BoxGeometry(1.6,.2,.08),new THREE.MeshBasicMaterial({color:0xff3b30}));tl.position.set(0,.8,-2.12);g.add(tl);
  return g;
}
const cars=[];
for(const poly of roadPolys.slice(0,6)){
  const car=makeCar([0xd23c3c,0xf2f2f2,0x3c7fd2,0xf2b23c,0x2fae5f,0x9b59b6][cars.length%6]);
  scene.add(car);
  cars.push({o:car,poly,i:1,speed:7+Math.random()*5,manual:false});
}

/* 🚶 මිනිස්සු */
function makeGuy(shirt,pant){
  const g=new THREE.Group(),skin=new THREE.MeshStandardMaterial({color:0xc98d5a});
  const head=new THREE.Mesh(new THREE.SphereGeometry(.28,12,10),skin);head.position.y=1.72;g.add(head);
  const torso=new THREE.Mesh(new THREE.BoxGeometry(.55,.65,.3),new THREE.MeshStandardMaterial({color:shirt}));torso.position.y=1.25;g.add(torso);
  const armL=new THREE.Mesh(new THREE.BoxGeometry(.16,.6,.16),skin);armL.position.set(-.36,1.25,0);
  const armR=armL.clone();armR.position.x=.36;
  const pm=new THREE.MeshStandardMaterial({color:pant});
  const legL=new THREE.Mesh(new THREE.BoxGeometry(.2,.7,.2),pm);legL.position.set(-.14,.55,0);
  const legR=legL.clone();legR.position.x=.14;
  g.add(armL,armR,legL,legR);g.userData={armL,armR,legL,legR};
  return g;
}
const player=makeGuy(0xc0392b,0x2b3a4a);scene.add(player);
const npcs=[];
for(let i=0;i<12;i++){
  const poly=roadPolys[i%roadPolys.length];if(!poly)break;
  const n=makeGuy([0x27ae60,0x2980b9,0xe67e22,0x8e44ad,0xf1c40f][i%5],0x223);
  const p=poly[Math.floor(Math.random()*poly.length)];
  n.position.set(p[0],0,p[1]);scene.add(n);
  npcs.push({o:n,poly,i:Math.floor(Math.random()*poly.length),speed:1+Math.random(),ph:0});
}

/* 🎮 Controls */
const stick=document.getElementById('stick'),knob=document.getElementById('knob');
let joy={x:0,y:0},run=false,inCar=null,heading=0,ph=0;
function mv(e){
  const r=stick.getBoundingClientRect();
  let dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2);
  const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m;}
  joy.x=dx;joy.y=dy;knob.style.transform=`translate(${dx*34}px,${dy*34}px)`;
}
stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);mv(e)});
stick.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')mv(e)});
stick.addEventListener('pointerup',()=>{joy.x=joy.y=0;knob.style.transform=''});
const runBtn=document.getElementById('run');
runBtn.onclick=()=>{run=!run;runBtn.classList.toggle('on',run)};
document.getElementById('drive').onclick=()=>{
  if(inCar){player.visible=true;player.position.set(inCar.o.position.x+3,0,inCar.o.position.z);inCar.manual=false;inCar=null;return;}
  let best=null,bd=7;
  for(const c of cars){const d=c.o.position.distanceTo(player.position);if(d<bd){bd=d;best=c;}}
  if(best){inCar=best;best.manual=true;player.visible=false;best.speed=0;}
};
document.getElementById('home').onclick=()=>{player.position.set(0,0,0);heading=0};

/* 🗺️ Mini-map */
const mm=document.getElementById('mm'),mx=mm.getContext('2d');
function drawMM(){
  const t=inCar?inCar.o:player;
  mx.clearRect(0,0,120,120);
  mx.save();mx.beginPath();mx.arc(60,60,57,0,7);mx.clip();
  mx.fillStyle='#0b1220';mx.fillRect(0,0,120,120);
  const s=.5;
  mx.translate(60,60);mx.rotate(t.rotation.y);mx.translate(-t.position.x*s,-t.position.z*s);
  mx.strokeStyle='#4a6088';mx.lineWidth=2;
  for(const p of roadLines){mx.beginPath();mx.moveTo(p[0][0]*s,p[0][1]*s);for(let i=1;i<p.length;i++)mx.lineTo(p[i][0]*s,p[i][1]*s);mx.stroke();}
  mx.restore();
  mx.fillStyle='#ff7bd5';mx.beginPath();mx.moveTo(60,50);mx.lineTo(66,70);mx.lineTo(60,65);mx.lineTo(54,70);mx.fill();
}

/* ⏱️ HUD */
let gameMin=21*60+35,money=500000000;
const clockEl=document.getElementById('clock'),moneyEl=document.getElementById('money');

/* 🔁 Loop */
const clock=new THREE.Clock();
function loop(){
  const dt=Math.min(clock.getDelta(),.05);
  if(!inCar){
    const sp=(run?7.5:3.2)*Math.hypot(joy.x,joy.y);
    if(sp>.15){
      heading=Math.atan2(joy.x,-joy.y);
      player.position.x+=Math.sin(heading)*sp*dt;
      player.position.z-=Math.cos(heading)*sp*dt;
      ph+=dt*sp*2.4;const u=player.userData;
      u.legL.rotation.x=Math.sin(ph)*.65;u.legR.rotation.x=-u.legL.rotation.x;
      u.armL.rotation.x=-u.legL.rotation.x;u.armR.rotation.x=-u.legR.rotation.x;
    }else{const u=player.userData;u.legL.rotation.x*=.85;u.legR.rotation.x*=.85;u.armL.rotation.x*=.85;u.armR.rotation.x*=.85;}
    player.rotation.y=-heading;
  }else{
    const c=inCar;
    if(joy.y<-.15)c.speed=Math.min(c.speed+11*dt,run?26:17);
    else if(joy.y>.25)c.speed=Math.max(c.speed-9*dt,-6);
    else c.speed*=Math.max(0,1-1.6*dt);
    if(Math.abs(c.speed)>1)c.o.rotation.y-=joy.x*dt*1.5*Math.sign(c.speed);
    c.o.position.x-=Math.sin(c.o.rotation.y)*c.speed*dt;
    c.o.position.z-=Math.cos(c.o.rotation.y)*c.speed*dt;
  }
  for(const c of cars){
    if(c.manual)continue;
    const tp=c.poly[c.i];
    const dx=tp[0]-c.o.position.x,dz=tp[1]-c.o.position.z,d=Math.hypot(dx,dz);
    if(d<1.5){c.i=(c.i+1)%c.poly.length;continue;}
    c.o.position.x+=dx/d*c.speed*dt;c.o.position.z+=dz/d*c.speed*dt;
    c.o.rotation.y=Math.atan2(-dx,-dz);
  }
  for(const n of npcs){
    const tp=n.poly[n.i],dx=tp[0]-n.o.position.x,dz=tp[1]-n.o.position.z,d=Math.hypot(dx,dz);
    if(d<1){n.i=Math.floor(Math.random()*n.poly.length);continue;}
    n.o.position.x+=dx/d*n.speed*dt;n.o.position.z-= -dz/d*n.speed*dt;
    n.o.rotation.y=-Math.atan2(dx,-dz);n.ph+=dt*n.speed*3;
    const u=n.o.userData;u.legL.rotation.x=Math.sin(n.ph)*.5;u.legR.rotation.x=-u.legL.rotation.x;
    u.armL.rotation.x=-u.legL.rotation.x;u.armR.rotation.x=-u.legR.rotation.x;
  }
  const t=inCar?inCar.o:player,h=inCar?7:5.2,d=inCar?12:8;
  const bx=Math.sin(t.rotation.y),bz=Math.cos(t.rotation.y);
  cam.position.lerp(new THREE.Vector3(t.position.x+bx*d,h,t.position.z+bz*d),1-Math.pow(.0015,dt));
  cam.lookAt(t.position.x,1.3,t.position.z);
  gameMin+=dt*2;
  const hh=Math.floor(gameMin/60)%24,mi=Math.floor(gameMin%60);
  clockEl.textContent=`${String(hh).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;
  moneyEl.textContent='Rs '+money.toLocaleString();
  drawMM();
  rend.render(scene,cam);
  requestAnimationFrame(loop);
}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rend.setSize(innerWidth,innerHeight)});
msg(`✅ මාතර: ගොඩනැගිලි ${bN}ක්, පාරවල් ${roadLines.length}ක් — ඇවිදින්න! 🇱🇰`);
setTimeout(()=>msg(''),2500);
loop();
</script>
</body>
</html>
